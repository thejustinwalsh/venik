name: Publish

# Publishes the package to npm with trusted publishing: npm verifies the
# GitHub OIDC token instead of a stored secret, and attaches provenance.
# The trusted publisher on npmjs.com must name this repository and this
# workflow file (publish.yml).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Check the tag matches package.json
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "Release tag v$tag does not match package.json version $version" >&2
            exit 1
          fi
      # prepublishOnly runs the typecheck, tests and build.
      - run: npm publish --access public
